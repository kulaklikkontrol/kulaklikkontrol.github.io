name: Model report
description: Tell us how Headphone Control works with your Sony headphones
title: "Model report: "
labels: ["model report"]
body:
  - type: dropdown
    id: model
    attributes:
      label: Headphone model
      options:
        - WH-1000XM4
        - WH-1000XM5
        - WH-1000XM6
        - WF-1000XM4
        - WF-1000XM5
        - WF-1000XM6
        - LinkBuds S
        - LinkBuds Fit
        - LinkBuds Open
        - WH-CH720N
        - ULT WEAR
        - Other
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version (if you know it)
  - type: input
    id: mac
    attributes:
      label: Mac model and macOS version
      placeholder: "MacBook Air M2, macOS 15.3"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Headphone Control version / build
      description: "Shown in TestFlight, or Settings > About in the app"
      placeholder: "1.1 (2)"
  - type: dropdown
    id: connected
    attributes:
      label: Did it connect?
      options:
        - "Yes"
        - "No"
        - "Sometimes"
    validations:
      required: true
  - type: textarea
    id: worked
    attributes:
      label: What worked
      description: "Please say worked / failed / not tried for each: noise cancelling, ambient sound, EQ, battery"
      value: |
        Noise cancelling:
        Ambient sound:
        EQ:
        Battery:
  - type: textarea
    id: broken
    attributes:
      label: What didn't work
  - type: textarea
    id: log
    attributes:
      label: Connection log (optional)
      description: 'Settings → About → "Advanced: connection log". Issues are public, so review the log before pasting.'
      render: text
